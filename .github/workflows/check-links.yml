name: Check links
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fingerprintjs/docs-link-checker@b8f0822d9a3f8e4a6325f899b3080a3244fa4a71 # main 2026-11-16
        with:
          files: |
            readme.md
            contributing.md
            src/**/*.ts
          baseline: linkcheck.baseline.json
